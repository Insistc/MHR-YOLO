# ID-YOLO reproduction:
# "ID-YOLO: A Multimodule Optimized Algorithm for Insulator Defect Detection in Power Transmission Line"
# Core changes: GConv + C3-GPF + MSIF + WFIF + SIoU.

nc: 4
box_loss: siou

scales:
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 6, 2, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, IDGConv, [128]] # 2, ID-YOLO GConv
  - [-1, 3, C3_GPF, [128, True]] # 3

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 1, IDGConv, [256]] # 5, ID-YOLO GConv
  - [-1, 6, C3_GPF, [256, True]] # 6-P3

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 1, IDGConv, [512]] # 8, ID-YOLO GConv
  - [-1, 9, C3_GPF, [512, True]] # 9-P4

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 1, IDGConv, [1024]] # 11, ID-YOLO GConv
  - [-1, 3, C3_GPF, [1024, True]] # 12
  - [-1, 1, MSIF, [1024]] # 13-P5, replaces SPPF

head:
  - [-1, 1, Conv, [512, 1, 1]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 9], 1, WFIF, [1]] # 16, replaces Concat
  - [-1, 3, C3_GPF, [512, False]] # 17

  - [-1, 1, Conv, [256, 1, 1]] # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 6], 1, WFIF, [1]] # 20, replaces Concat
  - [-1, 3, C3_GPF, [256, False]] # 21-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 18], 1, WFIF, [1]] # 23, replaces Concat
  - [-1, 3, C3_GPF, [512, False]] # 24-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 14], 1, WFIF, [1]] # 26, replaces Concat
  - [-1, 3, C3_GPF, [1024, False]] # 27-P5/32

  - [[21, 24, 27], 1, Detect, [nc]]
