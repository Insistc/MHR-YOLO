# ID-YOLO debug variant:
# Uses IDGConv + C3-GPF + MSIF in the backbone, while keeping the original
# YOLOv5 neck Concat/C3 and original Detect/loss.

nc: 4

scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 6, 2, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, IDGConv, [128]]
  - [-1, 3, C3_GPF, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, IDGConv, [256]]
  - [-1, 6, C3_GPF, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, IDGConv, [512]]
  - [-1, 9, C3_GPF, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, IDGConv, [1024]]
  - [-1, 3, C3_GPF, [1024, True]]
  - [-1, 1, MSIF, [1024]]

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]

  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]

  - [[21, 24, 27], 1, Detect, [nc]]
