# MFI-YOLO reproduction:
# "MFI-YOLO: Multi-Fault Insulator Detection Based on an Improved YOLOv8"
# Core changes: C2f -> C2f_MSAGhost in backbone, PANet -> ResPANet with MSAGhostBlock, original Detect head.

nc: 4
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_MSAGhost, [128, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f_MSAGhost, [256, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f_MSAGhost, [512, True]]

  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C2f_MSAGhost, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # Decoder: P5 + Down(P4) -> Conv -> Upsample -> P4 fusion
  - [6, 1, Conv, [1024, 3, 2]]
  - [[9, 10], 1, Concat, [1]]
  - [-1, 1, Conv, [1024, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[13, 6], 1, Concat, [1]]
  - [-1, 1, MSAGhostBlock, [512, False]]

  # Decoder: P4 + Down(P3) -> Conv -> Upsample -> P3 fusion
  - [4, 1, Conv, [512, 3, 2]]
  - [[15, 16], 1, Concat, [1]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[19, 4], 1, Concat, [1]]
  - [-1, 1, MSAGhostBlock, [256, False]]

  # Encoder: P3 -> P4
  - [21, 1, Conv, [512, 3, 2]]
  - [[22, 15, 6], 1, Concat, [1]]
  - [-1, 1, MSAGhostBlock, [512, False]]

  # Encoder: P4 -> P5
  - [24, 1, Conv, [1024, 3, 2]]
  - [[25, 12, 9], 1, Concat, [1]]
  - [-1, 1, MSAGhostBlock, [1024, False]]

  - [[21, 24, 27], 1, Detect, [nc]]
