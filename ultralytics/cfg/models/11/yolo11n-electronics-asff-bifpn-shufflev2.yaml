# Electronics 2025 reproduction:
# Improved YOLO11 Algorithm for Insulator Defect Detection in Power Distribution Lines.
# Core changes: deep-backbone ShuffleNetV2, BiFPN_CBAM neck, ASFF detection head.

nc: 4
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, ShuffleV2Stage, [512, 1]] # 6-P4, Electronics 2025 ShuffleNetV2 replacement
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, ShuffleV2Stage, [1024, 1]] # 8-P5, Electronics 2025 ShuffleNetV2 replacement
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Channel alignment for BiFPN_CBAM inputs.
  - [4, 1, Conv, [256, 1, 1]] # 11-P3 lateral
  - [6, 1, Conv, [512, 1, 1]] # 12-P4 lateral
  - [10, 1, Conv, [1024, 1, 1]] # 13-P5 lateral

  # Top-down BiFPN_CBAM path.
  - [13, 1, Conv, [512, 1, 1]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[12, 15], 1, BiFPN_Add2, [512]] # 16, Electronics 2025 weighted BiFPN fusion
  - [-1, 1, ElectronicsCBAM, [512]] # 17, Electronics 2025 CBAM after BiFPN
  - [-1, 2, C3k2, [512, False]] # 18

  - [18, 1, Conv, [256, 1, 1]] # 19
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20
  - [[11, 20], 1, BiFPN_Add2, [256]] # 21, Electronics 2025 weighted BiFPN fusion
  - [-1, 1, ElectronicsCBAM, [256]] # 22, Electronics 2025 CBAM after BiFPN
  - [-1, 2, C3k2, [256, False]] # 23-P3/8

  # Bottom-up BiFPN_CBAM path.
  - [23, 1, Conv, [512, 3, 2]] # 24
  - [[12, 18, 24], 1, BiFPN_Add3, [512]] # 25, Electronics 2025 weighted BiFPN fusion
  - [-1, 1, ElectronicsCBAM, [512]] # 26, Electronics 2025 CBAM after BiFPN
  - [-1, 2, C3k2, [512, False]] # 27-P4/16

  - [27, 1, Conv, [1024, 3, 2]] # 28
  - [[13, 28], 1, BiFPN_Add2, [1024]] # 29, Electronics 2025 weighted BiFPN fusion
  - [-1, 1, ElectronicsCBAM, [1024]] # 30, Electronics 2025 CBAM after BiFPN
  - [-1, 2, C3k2, [1024, True]] # 31-P5/32

  - [[23, 27, 31], 1, ASFFDetect, [nc]] # Electronics 2025 ASFF detection head
