# Electronics 2025 reproduction debug variant:
# Same ShuffleNetV2 backbone and BiFPN_CBAM neck as the main reproduction,
# but keeps the standard YOLO Detect head to isolate ASFF-specific issues.

nc: 4
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, ShuffleV2Stage, [512, 1]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, ShuffleV2Stage, [1024, 1]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [4, 1, Conv, [256, 1, 1]]
  - [6, 1, Conv, [512, 1, 1]]
  - [10, 1, Conv, [1024, 1, 1]]
  - [13, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[12, 15], 1, BiFPN_Add2, [512]]
  - [-1, 1, ElectronicsCBAM, [512]]
  - [-1, 2, C3k2, [512, False]]
  - [18, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[11, 20], 1, BiFPN_Add2, [256]]
  - [-1, 1, ElectronicsCBAM, [256]]
  - [-1, 2, C3k2, [256, False]]
  - [23, 1, Conv, [512, 3, 2]]
  - [[12, 18, 24], 1, BiFPN_Add3, [512]]
  - [-1, 1, ElectronicsCBAM, [512]]
  - [-1, 2, C3k2, [512, False]]
  - [27, 1, Conv, [1024, 3, 2]]
  - [[13, 28], 1, BiFPN_Add2, [1024]]
  - [-1, 1, ElectronicsCBAM, [1024]]
  - [-1, 2, C3k2, [1024, True]]
  - [[23, 27, 31], 1, Detect, [nc]]
